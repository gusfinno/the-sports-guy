
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sports Guy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-white-50 min-h-screen">

    <nav class="bg-blue-100 shadow-md px-8 py-4">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-6">
                <a href="/" class="text-2xl font-bold text-gray-800 hover:text-gray-700 font-2xl transition-colors">THESPORTSGUY</a>
                <a href="/f1" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Formula 1</a>
            </div>
            
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex"><h1 class="text-3xl font-extrabold mr-5">Formula 1</h1>
            </div>
        <div class="flex gap-4 mt-8">
            <div class="w-4/5 left_side">
                <div class="bg-blue-100 rounded-lg shadow p-6">
                    
                </div>
            </div>
            <div class="w-1/5 bg-blue-100 rounded-lg shadow p-6" style="width: 40%">
                <div class="driver_standings">
                    <table class="w-full text-sm text-left">
                        <thead class="text-gray-500 border-b border-blue-300">
                            <tr>
                                <th class="py-2 pr-2">#</th>
                                <th class="py-2 pr-2">Driver</th>
                                <th class="py-2 pr-2">Team</th>
                                <th class="py-2 text-right">Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for driver in driver_standings %}
                            <tr class="border-b border-blue-200">
                                <td class="py-2 pr-2 text-gray-500">{{ loop.index }}</td>
                                <td class="py-2 pr-2 font-medium">{{ driver.first_name }} {{ driver.last_name }}</td>
                                <td class="py-2 pr-2 text-gray-600">{{ driver.constructor_name }}</td>
                                <td class="py-2 text-right font-semibold">{{ driver.points | int }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
